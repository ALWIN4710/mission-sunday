services:
  - type: web
    name: mission-sunday-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://mission-sunday-dxb5.vercel.app
      - key: MONGODB_URI
        sync: false
